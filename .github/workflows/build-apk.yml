name: Build KW PLAYER 3.0 APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unpack project archive
        run: |
          unzip -q KW_PLAYER_3.0_NATYWNY_PROJEKT.zip -d source
          test -f source/KW_PLAYER_3.0/settings.gradle.kts

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p source/KW_PLAYER_3.0 --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KW-PLAYER-3.0-debug
          path: source/KW_PLAYER_3.0/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
